<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ExpenseIQ — Sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="min-h-screen flex items-center justify-center">

  <main class="auth-shell">

    <!-- Brand -->
    <div class="auth-brand">
      <span class="mark mark-lg" aria-hidden="true">₹</span>
      <span class="brand-text">
        <span class="wordmark">ExpenseIQ</span>
        <span class="tagline">smart expense tracker</span>
      </span>
    </div>

    <!-- Auth Card -->
    <div class="panel auth-card">

      <!-- Tab Toggle -->
      <div class="segmented segmented-lg w-full" style="display:flex" role="tablist">
        <button id="tab-login" onclick="switchTab('login')" role="tab"
          class="tab-btn seg-btn active flex-1" style="flex:1">
          Sign in
        </button>
        <button id="tab-signup" onclick="switchTab('signup')" role="tab"
          class="tab-btn seg-btn" style="flex:1">
          Sign up
        </button>
      </div>

      <!-- Error/Success Banner -->
      <div id="auth-banner" class="hidden banner"></div>

      <!-- LOGIN FORM -->
      <div id="login-form">
        <h2 class="auth-heading">Sign in</h2>
        <p class="auth-sub">Sign in to see your spending</p>

        <form class="auth-form" onsubmit="return false">
          <div class="field">
            <label class="field-label" for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email"
              class="input-field" />
          </div>
          <div class="field">
            <label class="field-label" for="login-password">Password</label>
            <div class="pw-wrap">
              <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"
                class="input-field" />
              <button type="button" class="pw-toggle" onclick="togglePassword('login-password', this)" aria-label="Show password">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button type="button" onclick="handleLogin()"
            class="btn btn-primary btn-block" id="login-btn">
            <span id="login-btn-text">Sign in</span>
            <span id="login-btn-loader" class="hidden items-center justify-center gap-2" style="gap:8px">
              <span class="loader"></span>
              Signing in
            </span>
          </button>
        </form>

        <p class="auth-switch">
          Don't have an account?
          <button onclick="switchTab('signup')" class="link-btn ml-1">Sign up</button>
        </p>
      </div>

      <!-- SIGNUP FORM -->
      <div id="signup-form" class="hidden">
        <h2 class="auth-heading">Create account</h2>
        <p class="auth-sub">Create a login for your expenses</p>

        <form class="auth-form" onsubmit="return false">
          <div class="field">
            <label class="field-label" for="signup-name">Full name</label>
            <input type="text" id="signup-name" placeholder="John Doe" autocomplete="name"
              class="input-field" />
          </div>
          <div class="field">
            <label class="field-label" for="signup-email">Email</label>
            <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email"
              class="input-field" />
          </div>
          <div class="field">
            <label class="field-label" for="signup-password">Password</label>
            <div class="pw-wrap">
              <input type="password" id="signup-password" placeholder="Min. 8 characters" autocomplete="new-password"
                class="input-field" />
              <button type="button" class="pw-toggle" onclick="togglePassword('signup-password', this)" aria-label="Show password">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="hint-list" id="pwd-hints">
              <div class="hint" id="hint-len">
                <span class="hint-dot" id="hint-len-dot"></span>
                <span>At least 8 characters</span>
              </div>
              <div class="hint" id="hint-num">
                <span class="hint-dot" id="hint-num-dot"></span>
                <span>Contains a number</span>
              </div>
            </div>
          </div>
          <div class="field">
            <label class="field-label" for="signup-confirm">Confirm password</label>
            <input type="password" id="signup-confirm" placeholder="••••••••" autocomplete="new-password"
              class="input-field" />
          </div>
          <button type="button" onclick="handleSignup()"
            class="btn btn-primary btn-block" id="signup-btn">
            <span id="signup-btn-text">Create account</span>
            <span id="signup-btn-loader" class="hidden items-center justify-center gap-2" style="gap:8px">
              <span class="loader"></span>
              Creating
            </span>
          </button>
        </form>

        <p class="auth-switch">
          Already have an account?
          <button onclick="switchTab('login')" class="link-btn ml-1">Sign in</button>
        </p>
      </div>

    </div>

    <!-- Footer -->
    <p class="auth-foot">Passwords are hashed with bcrypt · Your expenses stay in your account</p>
  </main>

  <script src="auth.js"></script>
</body>
</html>
